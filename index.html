<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141719"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>HYBRID</title><style>
*{box-sizing:border-box}body{margin:0;background:#141719;color:#f4f5f4;font:16px system-ui;padding:20px 16px 100px}main{max-width:640px;margin:auto}h1{margin:0;font-size:32px}h2{font-size:19px}small,label{color:#b1b9bb}section{background:#23292c;border-radius:16px;padding:16px;margin:14px 0}button,input,textarea,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #465054;background:#181d20;color:white;min-width:0}button{cursor:pointer;background:#343d40;border:0}button.primary,button.active{background:#b8d58c;color:#182012;font-weight:700}input,textarea,select{width:100%;margin:5px 0}input[type=checkbox]{width:22px;accent-color:#b8d58c} .row{display:flex;align-items:center;gap:10px;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid div{background:#171c1f;padding:12px;border-radius:10px}.big{font-size:40px;font-weight:750}.macro{font-size:23px;font-weight:bold}.bar{height:9px;background:#41494c;border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#b8d58c}nav{position:fixed;bottom:0;left:0;right:0;background:#202629;display:flex;justify-content:center;gap:5px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:2}nav button{font-size:12px;flex:1;max-width:125px;padding:13px 4px}.entry{border-bottom:1px solid #41494c;padding:12px 0}.wide{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.accent{color:#b8d58c}#notice{color:#eac17c;white-space:pre-wrap}a{color:#b8d58c}</style></head><body><main><small class="accent">PERFORMANCE / NUTRITION</small><div class="row"><h1>HYBRID.</h1><button onclick="go('Settings')">Settings</button></div><input type="date" id="date"><div id="notice" role="status"></div><div id="view"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const template=[['Rest or easy walk','Mobility'],['Easy run — 30 min','Pull-ups — 5 sets','Bench press — 4 × 8','Plank — 3 × 60 sec'],['Warm-up — 10 min','6 × 400 m intervals','Cooldown — 10 min'],['Squats — 3 × 8','Romanian deadlift — 3 × 10','Lunges — 3 × 10'],['Zone 2 run — 35 min','Pull-ups — 5 sets','Rows — 3 × 10'],['880-yard practice','Overhead press — 4 × 15','Farmer carries — 4 rounds'],['Easy long run — 45 min','Core circuit','Mobility']];
const fresh=()=>({version:1,goals:{k:1678,p:150,c:150,f:53},days:{},saved:[]});
let S=fresh(),tab='Today',date=today();try{let raw=localStorage.getItem('hybrid-v1');if(raw)S=JSON.parse(raw)}catch(e){$('notice').textContent='Storage could not be read.'}
function save(){try{localStorage.setItem('hybrid-v1',JSON.stringify(S));$('notice').textContent=''}catch(e){$('notice').textContent='Could not save locally. Export a backup now.'}}
function day(){return S.days[date]??={foods:[],work:template[new Date(date+'T12:00').getDay()].map(name=>({name,done:false,notes:''})),weight:null,performance:''}}
function go(t){tab=t;render()}function changeDate(d){date=d;render()}$('date').value=date;$('date').onchange=e=>{if(e.target.value)changeDate(e.target.value)};
const keys=['k','p','c','f'], labels=['Calories','Protein','Carbs','Fat'], num=x=>Math.round(x*10)/10;
function totals(d=day()){return keys.map(k=>num(d.foods.reduce((a,b)=>a+Number(b[k]||0),0)))}
function nutrition(){let t=totals(),g=S.goals;return `<section><small>DAILY CALORIES</small><div class="big">${t[0]} <small style="font-size:16px">/ ${g.k} kcal</small></div><div class="bar"><i style="width:${Math.min(100,t[0]/g.k*100)}%"></i></div><small>${num(Math.abs(g.k-t[0]))} kcal ${g.k>=t[0]?'remaining':'over target'}</small><div class="grid" style="margin-top:15px">${keys.slice(1).map((k,i)=>`<div><small>${labels[i+1]}</small><div class="macro">${t[i+1]}g</div><small>/ ${g[k]}g</small></div>`).join('')}</div></section>`}
function workout(){let w=day().work;return `<section><div class="row"><b>Daily workout</b><small>${w.filter(x=>x.done).length}/${w.length} complete</small></div>${w.map((x,i)=>`<div class="entry"><label class="row" style="justify-content:flex-start;color:white"><input type="checkbox" ${x.done?'checked':''} onchange="toggle(${i},this.checked)"><span style="${x.done?'text-decoration:line-through':''}">${esc(x.name)}</span></label><input placeholder="Sets, reps, weight or time" value="${esc(x.notes)}" onchange="note(${i},this.value)"></div>`).join('')}</section>`}
function toggle(i,v){day().work[i].done=v;save();render()}function note(i,v){day().work[i].notes=v;save()}
function fields(){return `<input id="food" placeholder="Food or meal name"><div class="two">${keys.map((k,i)=>`<label>${labels[i]} (${i?'g':'kcal'})<input id="${k}" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label>`).join('')}</div><label><input type="checkbox" id="favorite"> Save as frequent meal</label><button class="primary wide" onclick="addFood()">Add food</button>`}
function addFood(){let name=$('food').value.trim();if(!name)return alert('Enter a food name.');let f={name};for(let k of keys){let v=Number($(k).value||0);if(!Number.isFinite(v)||v<0)return alert('Enter valid nonnegative numbers.');f[k]=v}day().foods.push(f);if($('favorite').checked)S.saved.push({...f});save();render()}
function quick(i){day().foods.push({...S.saved[i]});save();render()}function removeFood(i){day().foods.splice(i,1);save();render()}function removeSaved(i){S.saved.splice(i,1);save();render()}
async function searchFood(){let q=$('query').value.trim();if(!q)return;let out=$('results');out.textContent='Searching…';try{let barcode=/^\d{8,14}$/.test(q),url=barcode?'https://world.openfoodfacts.org/api/v2/product/'+q+'.json':'https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=10';let r=await fetch(url);if(!r.ok)throw Error();let j=await r.json();results=(barcode?(j.product?[j.product]:[]):j.products||[]).filter(p=>p.product_name&&p.nutriments&&Number.isFinite(Number(p.nutriments['energy-kcal_100g'])));out.innerHTML=results.map((p,i)=>`<div class="entry"><b>${esc(p.product_name)}</b><br><small>${esc(p.brands||'')} · ${p.nutriments['energy-kcal_100g']} kcal / 100g</small><br><button onclick="useResult(${i})">Use food</button></div>`).join('')||'No matching food found.'}catch(e){out.textContent='Food search unavailable. You can still enter macros manually.'}}
let results=[];function useResult(i){let p=results[i],g=Number(prompt('Serving weight in grams','100'));if(!Number.isFinite(g)||g<=0)return;$('food').value=p.product_name;['energy-kcal','proteins','carbohydrates','fat'].forEach((k,j)=>$(keys[j]).value=num(Number(p.nutriments[k+'_100g']||0)*g/100));$('food').scrollIntoView({behavior:'smooth'})}
function saveWorkout(){let names=$('plan').value.split('\n').map(x=>x.trim()).filter(Boolean);day().work=names.map(name=>day().work.find(x=>x.name===name)||{name,done:false,notes:''});save();render()}
function importWeek(){let lines=$('week').value.split('\n'),current=null,groups={};for(let line of lines){let m=line.trim().match(/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*:?\s*$/i);if(m){current=m[1].toLowerCase();groups[current]=[]}else if(current&&line.trim())groups[current].push(line.trim().replace(/^[-•]\s*/,''))}if(!Object.keys(groups).length)return alert('Use weekday headings on separate lines.');if(!confirm('Replace workouts for the listed days in the selected week?'))return;let d=new Date(date+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));['monday','tuesday','wednesday','thursday','friday','saturday','sunday'].forEach((n,i)=>{if(groups[n]){let a=new Date(d);a.setDate(a.getDate()+i);let key=new Date(a-a.getTimezoneOffset()*60000).toISOString().slice(0,10);let old=S.days[key]||{foods:[],weight:null,performance:''};old.work=groups[n].map(name=>({name,done:false,notes:''}));S.days[key]=old}});save();render()}
function saveWeight(){let v=Number($('weight').value);if(v>0){day().weight=v;save();render()}}function savePerformance(){day().performance=$('perf').value;save();render()}
function goals(){for(let k of keys){let v=Number($('goal'+k).value);if(!Number.isFinite(v)||v<0||(k==='k'&&v===0))return alert('Invalid goal.')}keys.forEach(k=>S.goals[k]=Number($('goal'+k).value));save();render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='HYBRID-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function valid(x){return x&&x.version===1&&x.goals&&keys.every(k=>Number.isFinite(x.goals[k])&&x.goals[k]>=0)&&x.goals.k>0&&x.days&&typeof x.days==='object'&&Array.isArray(x.saved)&&[...x.saved,...Object.values(x.days).flatMap(d=>d.foods||[])].every(f=>typeof f.name==='string'&&keys.every(k=>Number.isFinite(f[k])&&f[k]>=0))&&Object.values(x.days).every(d=>Array.isArray(d.foods)&&Array.isArray(d.work)&&d.work.every(w=>typeof w.name==='string'&&typeof w.done==='boolean'))}
async function restore(file){try{let x=JSON.parse(await file.text());if(!valid(x))throw Error();if(confirm('Replace all current data with this backup?')){S=x;save();render()}}catch(e){alert('Invalid HYBRID backup. Current data was not changed.')}}
function render(){let d=day();$('nav').innerHTML=['Today','Nutrition','Training','Progress'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let v='';
if(tab==='Today')v=nutrition()+`<button class="primary wide" onclick="go('Nutrition')">+ Log food</button>`+workout();
if(tab==='Nutrition')v=nutrition()+`<section><h2>Find food</h2><small>Open Food Facts · internet required · enter barcode digits or food name</small><div class="row"><input id="query" placeholder="Food name or barcode"><button onclick="searchFood()">Search</button></div><div id="results"></div></section><section><h2>Log food</h2>${fields()}</section><section><h2>Food diary</h2>${d.foods.map((f,i)=>`<div class="entry row"><div>${esc(f.name)}<br><small>${f.k} kcal · P ${f.p} · C ${f.c} · F ${f.f}</small></div><button onclick="removeFood(${i})">×</button></div>`).join('')||'<small>No meals yet.</small>'}</section><section><h2>Saved meals</h2>${S.saved.map((f,i)=>`<div class="entry row"><span>${esc(f.name)}</span><button onclick="quick(${i})">Add</button><button onclick="removeSaved(${i})">×</button></div>`).join('')||'<small>No saved meals yet.</small>'}</section>`;
if(tab==='Training')v=workout()+`<section><h2>Edit workout</h2><textarea id="plan" rows="7">${esc(d.work.map(w=>w.name).join('\n'))}</textarea><button class="primary wide" onclick="saveWorkout()">Save workout</button></section><section><h2>Import weekly plan</h2><small>Paste weekday headings (Monday, Tuesday…) with one exercise per line. Applies to the week of the selected date.</small><textarea id="week" rows="8" placeholder="Monday&#10;Easy run — 30 min&#10;Tuesday&#10;Pull-ups — 5 sets"></textarea><button class="primary wide" onclick="importWeek()">Import week</button></section>`;
if(tab==='Progress'){let dates=Object.keys(S.days).sort().reverse();v=`<section><h2>Body weight</h2><div class="row"><input id="weight" type="number" min="0" step=".1" placeholder="Weight (lb)" value="${esc(d.weight??'')}"><button onclick="saveWeight()">Save</button></div></section><section><h2>PFT / CFT / personal records</h2><textarea id="perf" rows="4" placeholder="Record run times, pull-ups, plank, ammo can lifts, MUF…">${esc(d.performance)}</textarea><button onclick="savePerformance()">Save performance</button></section><section><h2>Daily history</h2>${dates.filter(k=>{let a=S.days[k];return a.foods.length||a.weight||a.performance||a.work.some(w=>w.done)}).map(k=>{let a=S.days[k];return `<div class="entry"><b>${k}</b><br><small>${totals(a)[0]} kcal · ${a.work.filter(w=>w.done).length}/${a.work.length} exercises${a.weight?' · '+a.weight+' lb':''}</small><div>${esc(a.performance)}</div></div>`}).join('')||'<small>No history yet.</small>'}</section>`}
if(tab==='Settings')v=`<section><h2>Daily targets</h2>${keys.map((k,i)=>`<label>${labels[i]}<input id="goal${k}" type="number" min="0" value="${S.goals[k]}"></label>`).join('')}<button class="primary wide" onclick="goals()">Save targets</button><small>Starting targets are editable examples, not a medical recommendation.</small></section><section><h2>Backup & restore</h2><p>Data stays in this browser on your device. Export regularly, especially before clearing website data or changing phones.</p><button class="primary wide" onclick="backup()">Export JSON backup</button><label>Restore backup<input type="file" accept=".json,application/json" onchange="if(this.files[0])restore(this.files[0])"></label></section><section><small>Food search uses Open Food Facts. Verify nutrition values against packaging. Sample workouts are editable.</small></section>`;
$('view').innerHTML=v}
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
